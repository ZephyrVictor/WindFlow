name: paper-review
control: true

nodes:
  reader:
    agent: reader
    backend: claude
    task: 精读工作目录中的论文，产出 notes.md 精读笔记
    inject: [memory/context.md]
    gate: true

  methodology:
    agent: methodology-reviewer
    backend: claude
    task: 审查论文方法论，产出 review-methodology.md
    needs: [reader]
    inject: [memory/context.md, memory/findings.md, agents/reader/summary.md]

  experiments:
    agent: experiments-reviewer
    backend: claude
    task: 审查论文实验设计与结果，产出 review-experiments.md
    needs: [reader]
    inject: [memory/context.md, memory/findings.md, agents/reader/summary.md]

  reviewer:
    agent: reviewer
    backend: claude
    task: 综合两路审查意见，产出最终审稿意见 artifacts/review.md
    needs: [methodology, experiments]
    inject:
      - memory/context.md
      - memory/findings.md
      - memory/decisions.md
      - agents/reader/summary.md
      - agents/methodology/summary.md
      - agents/experiments/summary.md
