name: iot-hunter-c3550-static
control: true

nodes:
  unpacker:
    agent: unpacker
    backend: claude
    task: 本轮唯一目标固件 workdir/firmwares/c3550-i5k2l2q3-tar.121-22.EA1.tar（Cisco Catalyst 3550 IOS 12.1(22)EA1，MZIP 单体镜像）。解包到 workdir/extracted/c3550/，识别设备与版本，产出攻击面盘点；workdir/firmwares/ 下其他固件属于别的轮次，不要动
    gate: true
    inject: [memory/context.md]

  planner:
    agent: planner
    backend: claude
    task: 制定审计计划，生成 audit skills 与子流水线并同步执行，直至子流水线完成
    needs: [unpacker]
    inject:
      - memory/context.md
      - memory/findings.md
      - agents/unpacker/summary.md

  correlator:
    agent: correlator
    backend: claude
    task: 汇总审计发现，拼装漏洞利用链，产出候选漏洞清单 artifacts/vulns.md
    needs: [planner]
    inject:
      - memory/context.md
      - memory/findings.md
      - memory/surface.md
      - agents/planner/summary.md

  reporter:
    agent: reporter
    backend: claude
    task: 产出最终漏洞报告 artifacts/report.md（本轮为静态轮：以静态证据收尾，报告即终判）
    needs: [correlator]
    gate: true
    inject:
      - memory/context.md
      - memory/findings.md
      - agents/correlator/summary.md
